<html lang="en-GB">

<title>Hiscores</title>
<style>
  /* Layout modelled on the Old School hiscores: skill list left, parchment scroll centre,
     stone boxes right. All drawn in CSS; no Jagex artwork is used. */
  :root {
    --gold: #d9c27e; --gold-bright: #ffe139; --stone: #2b2620; --stone-edge: #5a5043;
    --banner: #1b2236; --banner-edge: #3b4666; --paper: #cdbb8c; --paper-dark: #b29f70; --ink: #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff; font: 13px/18px Arial, Helvetica, sans-serif;
    background-color: #0b0a08;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(60, 52, 40, .35) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, rgba(60, 52, 40, .3) 0 2px, transparent 3px),
      linear-gradient(#14110d, #070605);
    background-size: 46px 46px, 62px 62px, 100% 100%;
  }
  button, select { font: inherit; }
  .page { max-width: 920px; margin: 0 auto; padding: 16px 16px 40px; }
  header { text-align: center; padding: 18px 0 20px; }
  header h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: bold; color: var(--gold-bright); text-shadow: 2px 2px 0 #000; }
  header p { margin: 6px 0 0; color: var(--gold); }
  .cols { display: grid; grid-template-columns: 170px minmax(0, 1fr) 170px; gap: 14px; align-items: start; }

  /* Left: category banner */
  .banner { background: var(--banner); border: 2px solid var(--banner-edge); border-radius: 3px; padding: 8px 0 10px; box-shadow: 0 0 0 1px #000; }
  .banner h2, .box h2 { margin: 0 0 6px; font-size: 13px; text-align: center; color: var(--gold-bright); }
  .banner ul { list-style: none; margin: 0; padding: 0; }
  .banner li.sep { height: 1px; background: var(--banner-edge); margin: 7px 14px; }
  .link { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
  .banner .link { display: flex; align-items: center; width: 100%; padding: 2px 8px 2px 10px; color: var(--gold); }
  .banner .link:hover, .banner .link[aria-current="true"] { color: #fff; }
  .ic { display: inline-block; width: 16px; height: 16px; margin-right: 6px; flex: none; vertical-align: -3px; }
  .ic svg { display: block; width: 100%; height: 100%; }
  .scroll h2 .ic { width: 20px; height: 20px; vertical-align: -5px; }
  .link:focus-visible, .box button:focus-visible, select:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 1px; }

  /* Centre: parchment scroll */
  .scroll { color: var(--ink); }
  .scroll .roll { height: 16px; border-radius: 8px; border: 1px solid #5b4a26;
    background: linear-gradient(#e2d3a6, #a8935f 55%, #7d6a3d); box-shadow: 0 2px 3px rgba(0, 0, 0, .6); }
  .scroll .paper { margin: -4px 9px; padding: 16px 10px 20px; min-height: 300px; text-align: center;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255, 250, 225, .35), transparent 60%),
      radial-gradient(ellipse at 75% 80%, rgba(120, 95, 50, .25), transparent 55%),
      linear-gradient(90deg, var(--paper-dark), var(--paper) 9%, var(--paper) 91%, var(--paper-dark));
    border-left: 1px solid #6b5a33; border-right: 1px solid #6b5a33; }
  .scroll h2 { margin: 0 0 10px; font-size: 13px; font-weight: bold; }
  .scroll .tw { overflow: visible; }  /* never clip a table at desktop width */
  table { margin: 0 auto; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 1px 6px; height: 23px; text-align: right; white-space: nowrap; font-weight: normal; }
  th { font-weight: bold; }
  .l { text-align: left; }
  .c { text-align: center; }
  .scroll .link { color: var(--ink); }
  .scroll .link:hover { color: #7a1010; text-decoration: underline; }
  .win { font-weight: bold; }
  .gain { color: #1c5c12; }
  .on { color: #1c5c12; font-size: 11px; font-weight: bold; }
  .chart { margin: 20px auto 0; max-width: 330px; text-align: left; }
  .chart h3 { margin: 0 0 10px; font-size: inherit; text-align: center; }
  .crow { display: grid; grid-template-columns: 104px 1fr; align-items: end; gap: 8px; margin-bottom: 8px; }
  .cname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .crow svg { display: block; width: 100%; height: auto; border-bottom: 1px solid #6b5a33; }
  .bar { fill: #7a2318; }
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover, .hit.sel { fill: rgba(0, 0, 0, .1); }
  .caxis { display: flex; justify-content: space-between; margin-left: 112px; font-size: 11px; color: #4a3d1f; }
  .tip { margin: 8px 0 0; min-height: 18px; font-size: 12px; text-align: center; color: #2a2010; }
  .foot { margin: 12px 0 0; font-size: 11px; line-height: 15px; color: #4a3d1f; }

  /* Right: stone boxes */
  .side { display: grid; gap: 14px; }
  .box { background: var(--stone); border: 2px solid var(--stone-edge); border-radius: 4px; padding: 8px 10px 12px; text-align: center; box-shadow: 0 0 0 1px #000, inset 0 0 12px rgba(0, 0, 0, .6); }
  .box p { margin: 0; color: var(--gold); }
  .box select { width: 100%; margin-bottom: 6px; padding: 2px; background: #efe6c8; color: #000; border: 1px solid #000; }
  .box button { padding: 1px 10px; background: #e6e0cf; color: #000; border: 1px solid #000; cursor: pointer; }

  /* Below 900px the three columns stack, so the scroll always has the full width. */
  @media (max-width: 900px) {
    body { font-size: 15px; line-height: 21px; }
    .cols { grid-template-columns: 1fr; }
    .banner ul { display: flex; flex-wrap: wrap; gap: 4px 4px; padding: 0 8px; }
    .banner li.sep { display: none; }
    .banner .link { width: auto; padding: 4px 9px; border: 1px solid var(--banner-edge); border-radius: 3px; }
    .banner .link[aria-current="true"] { border-color: #fff; }
    .banner h2, .box h2, .scroll h2 { font-size: 15px; }
    th, td { height: 30px; }
    .side { grid-template-columns: 1fr 1fr; }
  }
  /* Phones: tighten wide tables so six columns fit; scrolling is the last resort only here. */
  @media (max-width: 480px) {
    .scroll .paper { padding-left: 4px; padding-right: 4px; }
    .scroll .tw { overflow-x: auto; }
    table.wide { font-size: 13px; }
    table.wide th, table.wide td { padding: 1px 4px; }
    table.wide .on { display: block; line-height: 1; }  /* under the name, so it adds no width */
  }
</style>

  $("heading").textContent = heading;
  if (iconKey) withIcon($("heading"), iconKey);
  const thead = el("thead"), tbody = el("tbody");
  thead.append(row(head, "th"));
  rows.forEach(r => tbody.append(row(r)));
  $("table").replaceChildren(thead, tbody);
  $("table").classList.toggle("wide", head.length > 4);
  $("extra").replaceChildren();
  $("foot").textContent = foot || "";
  $("foot").hidden = !foot;
}

/* Playtime from the server log: a table of recent totals plus one small bar chart per player. */
function renderPlaytime() {
  const P = D.playtime, n = P.days.length;
  const sum = (a, k) => a.slice(n - k).reduce((x, y) => x + y, 0);
  const players = [...P.players];
  D.characters.forEach(c => {
    if (!players.some(p => p.name === c.name)) players.push({ name: c.name, daily: new Array(n).fill(0), online: false });
  });
  players.sort((a, b) => sum(b.daily, 7) - sum(a.daily, 7) || sum(b.daily, 28) - sum(a.daily, 28));
  const h = s => s ? hrs(s) : "-";
  const rows = players.map((p, i) => {
    const ch = player(p.name), cell = el("span");
    cell.append(ch ? nameLink(ch) : p.name);
    if (p.online) cell.append(el("span", " online", "on"));
    return [[String(i + 1)], [cell, "l"], [h(p.daily[n - 1])], [h(sum(p.daily, 7))], [h(sum(p.daily, n))], [ch ? hrs(ch.playtime_s) : "-"]];
  });
  fill("Playtime Hiscores", [["Rank"], ["Name", "l"], ["Today"], ["7 days"], [n + " days"], ["Total"]], rows,
    "Hours. Recent figures come from the server log, with days in UK time. Total is the character's own counter.", "playtime");

  const k = Math.min(14, n), days = P.days.slice(n - k), W = 16, H = 44, NS = "http://www.w3.org/2000/svg";
  const active = players.filter(p => p.daily.slice(n - k).some(Boolean));
  const box = el("div", undefined, "chart");
  box.append(el("h3", "Hours per day, last " + k + " days"));
  if (!active.length) { box.append(el("p", "No sessions in the last " + k + " days.", "tip")); $("extra").append(box); return; }
  const max = Math.max(3600, ...active.flatMap(p => p.daily.slice(n - k)));
  const tip = el("p", "Hover or tap a bar for the figure. All rows share one scale.", "tip");
  const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([a, v]) => e.setAttribute(a, v)); return e; };
  active.forEach(p => {
    const row = el("div", undefined, "crow");
    row.append(el("span", p.name, "cname"));
    const svg = svgEl("svg", { viewBox: "0 0 " + k * W + " " + H, role: "img", "aria-label": p.name + ": hours per day" });
    p.daily.slice(n - k).forEach((s, i) => {
      const bh = s ? Math.max(2, Math.round(s / max * H)) : 0;
      if (bh) svg.append(svgEl("rect", { class: "bar", x: i * W + 3, y: H - bh, width: W - 6, height: bh, rx: Math.min(2, bh / 2) }));
      const hit = svgEl("rect", { class: "hit", x: i * W, y: 0, width: W, height: H });
      const when = new Date(days[i] + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      const say = () => {
        box.querySelectorAll(".hit.sel").forEach(e => e.classList.remove("sel"));
        hit.classList.add("sel");
        tip.textContent = p.name + ", " + when + ": " + (s ? hrs(s) + " h" : "did not play");
      };
      hit.addEventListener("pointerenter", say);
      hit.addEventListener("click", say);
      svg.append(hit);
    });
    row.append(svg);
    box.append(row);
  });
  const axis = el("div", undefined, "caxis");
  axis.append(el("span", new Date(days[0] + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })), el("span", "Today"));
  box.append(axis, tip);
  $("extra").append(box);
}

function renderCat(id) {
  if (id === "playtime" && D.playtime) return renderPlaytime();
  const c = cat(id);
  const chars = [...D.characters].sort((a, b) => c.value(b) - c.value(a));
  const week = id === "overall" && chars.some(p => p.week_xp != null) ? "xp"
    : id === "playtime" && chars.some(p => p.week_play_s != null) ? "play" : null;
  const head = [["Rank"], ["Name", "l"]];
  if (c.level) head.push(["Level"]);
  head.push([c.col]);
  if (week) head.push(["This week"]);
  const rows = chars.map(p => {
    const r = [[String(rank(c, p))], [nameLink(p), "l"]];
    if (c.level) r.push([fmt(c.level(p))]);
    r.push([c.show(p)]);
    if (week === "xp") r.push([p.week_xp ? "+" + fmt(p.week_xp) : "-", "gain"]);
    if (week === "play") r.push([p.week_play_s ? "+" + hrs(p.week_play_s) : "-", "gain"]);
    return r;
  });
  const unnamed = D.skills.some(s => s.id === id && !s.named);
  fill(c.label + " Hiscores", head, rows,
    unnamed ? "Skill names are not mapped yet, so skills show as numbers."
    : id === "quests" ? "Completed, out of the quests each character has discovered." : "", c.icon);
}

function renderPlayer(name) {
  const p = player(name);
  const rows = CATS.filter(c => !c.sep).map(c => {
    const b = withIcon(el("button", c.label, "link"), c.icon);
    b.onclick = () => go({ view: "cat", id: c.id });
    return [[b, "l"], [String(rank(c, p))], [c.level ? fmt(c.level(p)) : ""], [c.show(p)]];
  });
  fill("Personal scores for " + p.name, [["Skill", "l"], ["Rank"], ["Level"], ["XP"]], rows);
}

function renderCompare(a, b) {
  const pa = player(a), pb = player(b);
  const rows = CATS.filter(c => !c.sep).map(c => {
    const va = c.value(pa), vb = c.value(pb);
    const cell = p => c.level ? fmt(c.level(p)) + " (" + c.show(p) + ")" : c.show(p);
    return [[cell(pa), va > vb ? "win" : ""], [c.label, "c"], [cell(pb), vb > va ? "win l" : "l"]];
  });
  fill(pa.name + " vs " + pb.name, [[pa.name], ["Skill", "c"], [pb.name, "l"]], rows);
}

function go(next) {
  state = next;
  if (state.view === "cat") renderCat(state.id);
  else if (state.view === "player") renderPlayer(state.name);
  else renderCompare(state.a, state.b);
  [...$("cats").querySelectorAll("button")].forEach(b =>
    b.setAttribute("aria-current", String(state.view === "cat" && b.dataset.id === state.id)));
}

if (!D) {
  $("updated").textContent = "No data: this page is built by dw_build.py.";
} else {
  document.title = D.title;
  $("title").textContent = D.title;
  $("updated").textContent = "Last updated: " + new Date(D.updated).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
  CATS.forEach(c => {
    const li = el("li", undefined, c.sep ? "sep" : "");
    if (!c.sep) {
      const b = withIcon(el("button", c.label, "link"), c.icon);
      b.dataset.id = c.id;
      b.onclick = () => go({ view: "cat", id: c.id });
      li.append(b);
    }
    $("cats").append(li);
  });
  const names = D.characters.map(c => c.name).sort((a, b) => a.localeCompare(b));
  ["who", "cmp-a", "cmp-b"].forEach((id, i) => {
    names.forEach(n => $(id).append(el("option", n)));
    if (id === "cmp-b" && names.length > 1) $(id).selectedIndex = 1;
  });
  $("who-go").onclick = () => go({ view: "player", name: $("who").value });
  $("cmp-go").onclick = () => go({ view: "compare", a: $("cmp-a").value, b: $("cmp-b").value });
  go(state);
}
</script>
